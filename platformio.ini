; ─────────────────────────────────────────────────────────────────────────────
;  esp32-home  ·  PlatformIO project configuration
;  Board: ESP32 DevKit V1 (Type-C), WROOM-32, 4 MB flash
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = esp32dev

; ── Common settings shared by every environment ──────────────────────────────
[env]
platform  = espressif32@6.12.0     ; pinned: Arduino core 2.0.17 / IDF 4.4
board     = esp32dev
framework = arduino

; Dual-app-slot layout: OTA can never overwrite the firmware that is running.
board_build.partitions   = partitions_ota_4mb.csv
board_build.filesystem   = littlefs

monitor_speed   = 115200
monitor_filters = time, colorize, esp32_exception_decoder
upload_speed    = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3                 ; 0=none 3=info 5=verbose
    -DFW_VERSION=\"0.5.0\"
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384  ; headroom for OTA flash writes
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DASYNCWEBSERVER_REGEX               ; nice-to-have as the project grows

lib_deps =
    esp32async/ESPAsyncWebServer @ 3.12.0   ; pinned: pulls esp32async/AsyncTCP
    bblanchon/ArduinoJson @ ^7.4.0          ; parsing Firebase auth replies

; ── Default: flash over USB ──────────────────────────────────────────────────
[env:esp32dev]

; ── Flash over the air: `pio run -e ota -t upload` ───────────────────────────
;    Uses tools/ota_upload.py: streams the .bin to /update with an MD5 header,
;    shows progress, and fails loudly if the device rejects the image.
[env:ota]
upload_protocol = custom
upload_command  = python "$PROJECT_DIR/tools/ota_upload.py" --host esp32-home.local "$SOURCE"
